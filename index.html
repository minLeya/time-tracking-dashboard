<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/styles/mobile.css" />
    <link rel="stylesheet" href="assets/styles/desktop.css" />
    <script src="assets/scripts/script.js" defer></script>

    <title>Time tracking dashboard</title>

    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="body-container">
      <div class="person-card">
        <div class="container-report-for">
          <img
            src="assets/images/image-jeremy.png"
            class="jeremy-icon"
            alt="jeremy"
          />
          <div class="container-report-for-text">
            <div class="report-for">Report for</div>
            <div class="jeremy-name">Jeremy Robson</div>
          </div>
        </div>

        <div class="period-toggle">
          <button class="period-toggle-button daily">Daily</button>
          <button class="period-toggle-button weekly">Weekly</button>
          <button class="period-toggle-button monthly">Monthly</button>
        </div>
      </div>

      <div class="dashboard-card work">
        <div class="dahboard-card-text work-text">
          <div class="container-title-ellipsis">
            <div class="title">Work</div>
            <div class="ellipsis-div">
              <img
                src="assets/images/icon-ellipsis.svg"
                alt="ellipsis"
                class="ellipsis-img"
              />
            </div>
          </div>
          <!-- hours and previous are changing depend on toggle -->
          <div class="container-hours-previous">
            <div class="hours">32hrs</div>
            <div class="previous">
              Last
              <!-- Day/Week/Month -->- 36hrs
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-card play">
        <div class="dahboard-card-text play-text">
          <div class="container-title-ellipsis">
            <div class="title">Play</div>
            <div class="ellipsis-div">
              <img
                src="assets/images/icon-ellipsis.svg"
                alt="ellipsis"
                class="ellipsis-img"
              />
            </div>
          </div>
          <!-- hours and previous are changing depend on toggle -->
          <div class="container-hours-previous">
            <div class="hours">10hrs</div>
            <div class="previous">
              Last
              <!-- Day/Week/Month -->- 8hrs
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-card study">
        <div class="dahboard-card-text study-text">
          <div class="container-title-ellipsis">
            <div class="title">Study</div>
            <div class="ellipsis-div">
              <img
                src="assets/images/icon-ellipsis.svg"
                alt="ellipsis"
                class="ellipsis-img"
              />
            </div>
          </div>
          <!-- hours and previous are changing depend on toggle -->
          <div class="container-hours-previous">
            <div class="hours">4hrs</div>
            <div class="previous">
              Last
              <!-- Day/Week/Month -->- 7hrs
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-card exercise">
        <div class="dahboard-card-text exercise-text">
          <div class="container-title-ellipsis">
            <div class="title">Exercise</div>
            <div class="ellipsis-div">
              <img
                src="assets/images/icon-ellipsis.svg"
                alt="ellipsis"
                class="ellipsis-img"
              />
            </div>
          </div>
          <!-- hours and previous are changing depend on toggle -->
          <div class="container-hours-previous">
            <div class="hours">4hrs</div>
            <div class="previous">
              Last
              <!-- Day/Week/Month -->- 5hrs
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-card social">
        <div class="dahboard-card-text social-text">
          <div class="container-title-ellipsis">
            <div class="title">Social</div>
            <div class="ellipsis-div">
              <img
                src="assets/images/icon-ellipsis.svg"
                alt="ellipsis"
                class="ellipsis-img"
              />
            </div>
          </div>
          <!-- hours and previous are changing depend on toggle -->
          <div class="container-hours-previous">
            <div class="hours">5hrs</div>
            <div class="previous">
              Last
              <!-- Day/Week/Month -->- 10hrs
            </div>
          </div>
        </div>
      </div>

      <div class="dashboard-card self-care">
        <div class="dahboard-card-text self-care-text">
          <div class="container-title-ellipsis">
            <div class="title">Self Care</div>
            <div class="ellipsis-div">
              <img
                src="assets/images/icon-ellipsis.svg"
                alt="ellipsis"
                class="ellipsis-img"
              />
            </div>
          </div>
          <!-- hours and previous are changing depend on toggle -->
          <div class="container-hours-previous">
            <div class="hours">2hrs</div>
            <div class="previous">
              Last
              <!-- Day/Week/Month -->- 2hrs
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="https://github.com/minLeya">Leya</a>.
    </div>
  </body>
</html>
